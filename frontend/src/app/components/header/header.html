<header class="border-b border-primary-300/20 bg-gradient-to-r from-night-950/95 via-night-950/85 to-night-950/95 shadow-xl shadow-primary-950/30 backdrop-blur-xl">
  <nav
    class="mx-auto flex w-full max-w-7xl items-center justify-between gap-4 px-5 py-4 sm:px-8"
    aria-label="Navegação principal"
  >
    <a class="group inline-flex items-center gap-3 rounded-full focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-300 focus-visible:ring-offset-2 focus-visible:ring-offset-night-950" href="/" aria-label="Ir para a página inicial do KarvCoins">
      <img ngSrc="/logo.png" width="64" height="64" alt="" priority class="h-14 w-14 rounded-2xl bg-night-950/60 p-2 object-contain ring-1 ring-primary-300/20" />
      <span class="leading-tight">
        <span class="font-brand block text-base font-bold tracking-tight text-white sm:text-lg">KarvCoins</span>
        <span class="hidden text-xs text-primary-100/70 sm:block">Mérito que vira oportunidade</span>
      </span>
    </a>

    <div class="flex items-center gap-3 sm:gap-4">
      @if (itensNavegacao().length > 0) {
        <div class="hidden items-center gap-1 rounded-full border border-primary-300/20 bg-night-950/60 p-1 md:flex" aria-label="Navegação do perfil">
          @for (item of itensNavegacao(); track item.rota) {
            <a
              #rotaAtiva="routerLinkActive"
              class="rounded-full px-4 py-1.5 text-sm font-semibold transition hover:bg-primary-500/10 hover:text-primary-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-300 focus-visible:ring-offset-2 focus-visible:ring-offset-night-950"
              routerLinkActive=""
              [routerLinkActiveOptions]="{ exact: true }"
              [class.bg-primary-500/15]="rotaAtiva.isActive"
              [class.text-primary-100]="rotaAtiva.isActive"
              [class.text-slate-300]="!rotaAtiva.isActive"
              [routerLink]="item.rota"
            >
              {{ item.label }}
            </a>
          }
        </div>
        <span class="hidden h-6 w-px bg-primary-300/20 md:inline-flex" aria-hidden="true"></span>
      }

      @if (saldoLabel()) {
        <span class="inline-flex whitespace-nowrap rounded-full border border-primary-300/25 bg-primary-500/10 px-3 py-1.5 text-xs font-semibold text-primary-100 sm:px-4 sm:py-2 sm:text-sm">
          {{ saldoLabel() }}
        </span>
        <span class="hidden h-6 w-px bg-primary-300/20 sm:inline-flex" aria-hidden="true"></span>
      }

      <button
        type="button"
        class="inline-flex items-center gap-2 rounded-full px-5 py-2.5 text-sm font-semibold transition duration-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-300 focus-visible:ring-offset-2 focus-visible:ring-offset-night-950"
        [class.border]="actionVariant() === 'outline'"
        [class.border-primary-300/50]="actionVariant() === 'outline'"
        [class.bg-transparent]="actionVariant() === 'outline'"
        [class.text-primary-100]="actionVariant() === 'outline'"
        [class.hover:bg-primary-400/10]="actionVariant() === 'outline'"
        [class.bg-primary-500]="actionVariant() === 'solid'"
        [class.text-white]="actionVariant() === 'solid'"
        [class.shadow-lg]="actionVariant() === 'solid'"
        [class.shadow-primary-500/25]="actionVariant() === 'solid'"
        [class.hover:bg-primary-400]="actionVariant() === 'solid'"
        (click)="onActionClick()"
      >
        @if (actionVariant() === 'outline') {
          <span aria-hidden="true">←</span>
        }
        {{ actionLabel() }}
      </button>
    </div>
  </nav>
</header>
