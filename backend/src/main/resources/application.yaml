server:
  servlet:
    context-path: /api/karv-coins

spring:
  application:
    name: karv-coins
  datasource:
    url: jdbc:postgresql://ep-autumn-hall-acokcx3b-pooler.sa-east-1.aws.neon.tech/db-karv-coins-des?sslmode=require&channelBinding=require
    username: karv-coins-db-owner
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    addresses: ${QUEUE_ADDRESS}
  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${BREVO_SMTP_LOGIN:${MAIL_USERNAME:}}
    password: ${BREVO_SMTP_KEY:${MAIL_PASSWORD:}}
    test-connection: ${MAIL_TEST_CONNECTION:false}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT:10000}
          timeout: ${MAIL_SMTP_TIMEOUT:10000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT:10000}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
            required: true

app:
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
  security:
    jwt:
      issuer: karv-coins
      expiration-seconds: 3600
      secret: ${JWT_SECRET:jwtsecretasdasdasdsd}
  mail:
    enabled: ${MAIL_ENABLED:${BREVO_ENABLED:false}}
    validate-on-startup: ${MAIL_VALIDATE_ON_STARTUP:false}
    from: ${BREVO_MAIL_FROM:${MAIL_FROM:}}
    app-name: KarvCoins

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
